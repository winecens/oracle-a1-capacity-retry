name: Retry Oracle A1 capacity

on:
  # UN SOLO DISPARADOR: el Worker de Cloudflare
  # (wine-app/workers/oracle-retry-trigger, cron 0,30 = cada 30 min), que
  # dispara este workflow_dispatch.
  #
  # El cron nativo de GitHub ('0 * * * *') se retiro el 08-18: llegaba tarde y
  # desplazado bajo carga del runner compartido, asi que en vez de repartirse la
  # hora con el Worker se le encadenaba (17-08: dispatch 20:05 + schedule 20:14,
  # 9 min de separacion). Y encadenar es justo lo que nos mata: el limite que
  # nos frena es POST /jobs del Resource Manager (429 "Too many requests for the
  # tenant"). Las 24 ejecuciones previas al 08-18 fallaron TODAS en 429 sin
  # llegar a preguntar por capacidad: no sabiamos si habia A1 libre o no.
  workflow_dispatch: {}

concurrency:
  group: oracle-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli

      - name: Configura credenciales OCI
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/key.pem <<'EOF'
          ${{ secrets.OCI_KEY_CONTENT }}
          EOF
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<CFG
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY }}
          region=${{ secrets.OCI_REGION }}
          key_file=~/.oci/key.pem
          CFG
          chmod 600 ~/.oci/config

      - name: Intenta crear la instancia (Apply del stack)
        id: apply
        # Verde = maquina creada. Cualquier otra cosa (429, sin capacidad, error
        # de Terraform) sale en rojo. Antes el paso solo comprobaba que el job
        # ARRANCARA, asi que un "Out of host capacity" salia como success.
        run: |
          set -uo pipefail

          # --no-retry: sin el, el SDK reintenta con backoff dentro de la MISMA
          # ejecucion y un solo intento nuestro se convierte en ~8 POST /jobs
          # reales (el 429 tardaba 90-100 s en salir). A 4 intentos/hora eso son
          # 20-30 peticiones/hora contra el endpoint que nos esta pidiendo que
          # paremos: nos estabamos throttleando solos. Ahora 1 intento = 1 POST.
          if ! JOB_ID=$(oci --no-retry resource-manager job create-apply-job \
                --stack-id "${{ secrets.OCI_STACK_ID }}" \
                --execution-plan-strategy AUTO_APPROVED \
                --query 'data.id' --raw-output 2>/tmp/create_err.txt); then
            echo "--- no se pudo crear el job ---"
            cat /tmp/create_err.txt
            if grep -q 'TooManyRequests' /tmp/create_err.txt; then
              echo "resultado=RATE_LIMITED" >> "$GITHUB_OUTPUT"
              echo "### :hourglass: 429 del Resource Manager" >> "$GITHUB_STEP_SUMMARY"
              echo "No se llego a preguntar por capacidad. Espaciar mas los intentos." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "resultado=ERROR_CLIENTE" >> "$GITHUB_OUTPUT"
              echo "### :x: Error al crear el job (ver log del runner)" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi
          echo "Job creado: $JOB_ID"

          STATE="ACCEPTED"
          for i in $(seq 1 40); do
            STATE=$(oci resource-manager job get --job-id "$JOB_ID" --query 'data."lifecycle-state"' --raw-output) || STATE="DESCONOCIDO"
            echo "Estado ($i): $STATE"
            if [ "$STATE" = "SUCCEEDED" ] || [ "$STATE" = "FAILED" ]; then
              break
            fi
            sleep 15
          done

          echo "resultado=$STATE" >> "$GITHUB_OUTPUT"

          if [ "$STATE" = "SUCCEEDED" ]; then
            echo "### :white_check_mark: Instancia A1 creada" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Los logs vienen como JSON con los saltos de linea escapados: sin el
          # sed sale un unico churro de 40 KB donde no se lee nada.
          LOGS=$(oci resource-manager job get-job-logs-content --job-id "$JOB_ID" 2>/dev/null | sed 's/\\n/\n/g' || true)

          # QUE hemos pedido, no solo que nos contestaron. Antes solo se
          # imprimian las lineas de error, asi que un "Out of host capacity"
          # demostraba que Oracle respondio pero NO que le pidieramos la A1
          # correcta: el shape era inferencia. Con esto cada intento lo prueba.
          echo "--- lo que hemos pedido ---"
          echo "$LOGS" | grep -E 'shape|ocpus|memory_in_gbs|availability_domain' | head -n 8 || true
          if ! echo "$LOGS" | grep -q 'shape'; then
            echo "::warning::No aparece 'shape' en el log del job: revisar el formato antes de dar nada por bueno."
          fi

          echo "--- errores del job ---"
          echo "$LOGS" | grep -E '\[ERROR\]|Error:' | head -n 10 || true

          if echo "$LOGS" | grep -q 'Out of host capacity'; then
            echo "resultado=SIN_CAPACIDAD" >> "$GITHUB_OUTPUT"
            echo "### :no_entry: Oracle: Out of host capacity" >> "$GITHUB_STEP_SUMMARY"
            echo "Si llegamos a pedir la maquina; no habia. Reintento normal." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### :x: Job en estado $STATE (no es falta de capacidad)" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1

      - name: Avisa si tuvo éxito
        if: steps.apply.outputs.resultado == 'SUCCEEDED'
        run: |
          curl -s -d "✅ Instancia Oracle A1 (matcher besomm) creada con éxito. Revisa la consola OCI." \
            -H "Title: Oracle A1 disponible" \
            -H "Priority: high" \
            "ntfy.sh/${{ secrets.NTFY_TOPIC }}"
